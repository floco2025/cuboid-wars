[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
common = { path = "../common" }
bincode = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "signal"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
bevy = { version = "0.19", features = ["vorbis", "wav", "jpeg", "bevy_gltf"] }
rand = "0.10.1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whoami = "2.0.1"
bevy_mod_mipmap_generator = { git = "https://github.com/DGriffin91/bevy_mod_mipmap_generator", branch = "bevy19" }
