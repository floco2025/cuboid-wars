[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
common = { path = "../common" }
bincode = "2.0"
renet = "2"
renet_netcode = "2"
crossbeam-channel = "0.5"
anyhow = "1"
bevy = { version = "0.19", features = ["vorbis", "wav", "jpeg", "bevy_gltf"] }
rapier3d = "0.32"
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
raw-window-handle = "0.6"
bevy_mod_mipmap_generator = { git = "https://github.com/DGriffin91/bevy_mod_mipmap_generator", branch = "bevy19" }
