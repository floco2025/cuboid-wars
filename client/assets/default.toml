# Shared asset set.
#
# The client uses the full file for render/audio assets. The server should read
# the same file for material_rules and ignore client-only sections it does not
# need, such as materials, models, sounds, and texture file paths.
#
# Asset paths are relative to client/assets.
#
# The most specific matching material rule wins. For example, a floor rule with
# level + cols + rows beats a floor rule with only level, and an exact wall edge
# beats a level-wide wall rule. A rule without selector fields is the fallback
# for that rule list. Two matching rules with the same specificity but different
# materials are an error.
#
# Material assignment is part of map segmentation. The server must not merge
# floors or walls across different resolved material ids. The client should
# render each received floor/wall as one mesh with one material; if one segment
# spans multiple material rules, that is a map/merge error rather than a reason
# for the client to split the segment.
#
# Editor coordinate selectors:
# - floors use cell coordinates: cols = [min, max], rows = [min, max], inclusive
# - walls use grid-line edges: from = [col, row], to = [col, row]
# - ramps use their lower editor level
#
# Examples:
#
#   [[material_rules.floors]]
#   material = "ground"
#   level = 3
#   cols = [16, 19]
#   rows = [0, 3]
#
#   [[material_rules.walls]]
#   material = "wall"
#   level = 2
#   from = [4, 8]
#   to = [5, 8]

version = 1

[materials.ground]
tile_size = 8.0
metallic = 0.5
roughness = 0.5
repeat = true
data_textures_linear = true

[materials.ground.textures]
base_color = "textures/ground/albedo.png"
normal = "textures/ground/normal-dx.png"
occlusion = "textures/ground/ao.png"
metallic_roughness = "textures/ground/metallic-roughness.png"

[materials.roof]
tile_size = 6.0
metallic = 0.5
roughness = 0.5
repeat = true
data_textures_linear = true

[materials.roof.textures]
base_color = "textures/roof/albedo.png"
normal = "textures/roof/normal-dx.png"
occlusion = "textures/roof/ao.png"
metallic_roughness = "textures/roof/metallic-roughness.png"

[materials.wall]
tile_size = 6.0
metallic = 0.5
roughness = 0.5
repeat = true
data_textures_linear = true

[materials.wall.textures]
base_color = "textures/wall/albedo.png"
normal = "textures/wall/normal-dx.png"
occlusion = "textures/wall/ao.png"
metallic_roughness = "textures/wall/metallic-roughness.png"

[materials.cookie]
metallic = 1.0
roughness = 1.0
repeat = false
data_textures_linear = false

[materials.cookie.textures]
base_color = "textures/cookie/albedo.png"
normal = "textures/cookie/normal-dx.png"
occlusion = "textures/cookie/ao.png"
metallic_roughness = "textures/cookie/metallic-roughness.png"

[materials.power_up]
base_color = "item_type_color"
emissive = "item_type_color"
emissive_strength = 0.1
metallic = 1.0
roughness = 1.0
repeat = false
data_textures_linear = false

[materials.power_up.textures]
base_color = "textures/item/albedo.png"
normal = "textures/item/normal-dx.png"
occlusion = "textures/item/ao.png"
metallic_roughness = "textures/item/metallic-roughness.png"

[[material_rules.floors]]
material = "ground"
level = 0

[[material_rules.floors]]
material = "roof"

[[material_rules.walls]]
material = "wall"

[[material_rules.ramp_tops]]
material = "ground"

[[material_rules.ramp_sides]]
material = "wall"

[[material_rules.items]]
material = "cookie"
type = "Cookie"

[[material_rules.items]]
material = "power_up"

[models.player]
scene = "models/player.glb#Scene0"
scale = 0.53
height_offset = 0.0
animation_speed = 2.0

[models.wall_light]
scene = "models/wall_light.glb"
scale = 1.5

[sounds]
player_fire = "sounds/player_fires.ogg"
player_dry_click = "sounds/player_dry_click.ogg"
player_hit = "sounds/player_gets_hit.ogg"
player_power_up = "sounds/player_powerup.wav"
player_cookie = "sounds/player_cookie.ogg"
player_bumps_wall = "sounds/player_bumps_wall.ogg"
player_bumps_player = "sounds/player_bumps_player.ogg"
projectile_hits_wall = "sounds/projectile_hits_wall.ogg"
projectile_hits_player = "sounds/projectile_hits_player.ogg"
