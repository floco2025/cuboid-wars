name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PySide6
      - run: python -m unittest discover -s tools/tests -p "test_*.py"
        env:
          PYTHONPATH: tools
          QT_QPA_PLATFORM: offscreen
