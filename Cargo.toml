[package]
name = "cuboid-wars"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
client = { path = "client" }
server = { path = "server" }
common.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
bevy.workspace = true
crossbeam-channel.workspace = true
mimalloc = "0.1"
whoami = "2"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[workspace]
members = ["common", "server", "client", "map_core", "map_core_py"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
bevy = { version = "0.19", default-features = false }
bincode = "2.0"
common = { path = "common" }
map_core = { path = "map_core" }
crossbeam-channel = "0.5"
rand = "0.10"
rapier3d = "0.35"
renet = "2"
renet_netcode = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release.package.map_core_py]
# Rust's debuginfo stripping misaligns Mach-O libraries on macOS 27 (rust-lang/rust#157750).
strip = "none"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
