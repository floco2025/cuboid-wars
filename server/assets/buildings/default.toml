# Default building blueprint.
#
# Coordinates: cols increase east, rows increase south. Rectangles are
# half-open: `[col0, row0, col_end, row_end]` covers cols col0..col_end-1
# and rows row0..row_end-1.
#
# The authoring format uses the same primitives the game consumes:
# - `floors` are floor-cell masks.
# - `voids` remove floor cells, e.g. an atrium.
# - `walls` are explicit grid-line segments. Doorways are gaps between
#   segments, not separate door records.
# - `ramps` are rectangular ramp footprints with an ascending direction.

[building]
grid_cols = 20
grid_rows = 20
num_levels = 5

