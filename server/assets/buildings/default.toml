# Default building blueprint.
#
# Coordinates: cols increase east, rows increase south. Rectangles are
# half-open: `[col0, row0, col_end, row_end]` covers cols col0..col_end-1
# and rows row0..row_end-1.
#
# Levels: 0 = basement, 1 = lobby, 2 = rooms-low, 3 = rooms-high, 4 = rooftop.
#
# `perimeter` puts a wall around a rect (with optional doors). Inset
# `perimeter.rect` from `floor_rect` to leave the floor extending past the
# wall as a recessed balcony.

[building]
grid_cols = 20
grid_rows = 20
num_levels = 5

# ----------------------------------------------------------------------------
# Levels
# ----------------------------------------------------------------------------

[[building.levels]]
name = "basement"
floor_rect = [0, 0, 20, 20]
perimeter = { rect = [0, 0, 20, 20], doors = [] }   # walls flush with the floor edge
rooms = [
    # West stair shaft. Door on the south side at col 3 (east half of the shaft).
    { rect = [2, 3, 4, 7], doors = [{ side = "S", at = 3 }] },
    # East stair shaft. Door on the south side at col 16 (west half of the shaft).
    { rect = [16, 3, 18, 7], doors = [{ side = "S", at = 16 }] },
]

[[building.levels]]
name = "lobby"
floor_rect = [0, 0, 20, 20]
perimeter = { rect = [0, 0, 20, 20], doors = [] }
rooms = []

[[building.levels]]
name = "rooms-low"
floor_rect = [0, 0, 20, 20]
atrium = [7, 7, 12, 12]   # 5x5 void centered in the building
# Perimeter wall inset 1 cell. The strip between the wall and the floor
# edge is balcony space; apartment doors on the perimeter open onto each
# apartment's slice of that strip. The perimeter itself has no doors of
# its own — all balcony access is through apartments.
perimeter = { rect = [1, 1, 19, 19], doors = [] }
rooms = [
    # Stair shafts. The U-staircase's lobby->rooms-low ramp is north-up,
    # so the player arrives at the *north* end of the shaft on this level
    # — door on the north side or they can't exit. The south door from
    # the basement plan would dump them onto the lobby->rooms-low ramp's
    # body and drop them back to the lobby.
    { rect = [2, 3, 4, 7], doors = [{ side = "N", at = 3 }] },
    { rect = [16, 3, 18, 7], doors = [{ side = "N", at = 16 }] },

    # Six apartments. Each: one corridor door on the interior side, one
    # balcony door on the exterior side (which doubles as a hole in the
    # perimeter wall, since the apartment's outer wall coincides with it).

    # North: two big units along the top of the building, between the stair
    # shafts and the atrium-edge corridor at row 6.
    { rect = [4, 1, 10, 6], doors = [
        { side = "S", at = 6 },   # south wall (row 6)  -> corridor
        { side = "N", at = 6 },   # north wall (row 1)  -> balcony
    ] },
    { rect = [10, 1, 16, 6], doors = [
        { side = "S", at = 13 },
        { side = "N", at = 13 },
    ] },

    # South: mirror of north.
    { rect = [4, 14, 10, 19], doors = [
        { side = "N", at = 6 },   # north wall (row 14) -> corridor
        { side = "S", at = 6 },   # south wall (row 19) -> balcony
    ] },
    { rect = [10, 14, 16, 19], doors = [
        { side = "N", at = 13 },
        { side = "S", at = 13 },
    ] },

    # West: one apartment along the left side, between the two stair-shaft
    # rows and the atrium-edge corridor at col 6.
    { rect = [1, 8, 6, 12], doors = [
        { side = "E", at = 10 },  # east wall (col 6)  -> corridor
        { side = "W", at = 10 },  # west wall (col 1)  -> balcony
    ] },
    # East: mirror.
    { rect = [14, 8, 19, 12], doors = [
        { side = "W", at = 10 },
        { side = "E", at = 10 },
    ] },
]

[[building.levels]]
name = "rooms-high"
floor_rect = [0, 0, 20, 20]
atrium = [7, 7, 12, 12]
perimeter = { rect = [1, 1, 19, 19], doors = [
    { side = "N", at = 9 }, { side = "N", at = 10 },
    { side = "S", at = 9 }, { side = "S", at = 10 },
    { side = "E", at = 9 }, { side = "E", at = 10 },
    { side = "W", at = 9 }, { side = "W", at = 10 },
] }
rooms = []

[[building.levels]]
name = "rooftop"
floor_rect = [2, 2, 18, 18]   # 16x16 setback (2 cells inset on each side)
# No perimeter walls: the rooftop is open.
rooms = []

# ----------------------------------------------------------------------------
# Ramps
# ----------------------------------------------------------------------------
#
# Two U-shaped staircases, each spanning basement -> rooftop. Within a
# 2-cell-wide shaft, ramps zig-zag between the two columns and alternate
# direction (south-up / north-up) so the player walks up one flight, turns
# 180°, walks up the next.

# West staircase (cols 2-3)
[[building.ramps]]
direction = "south-up"
col = 2
row0 = 4
lower_level = 0           # basement -> lobby

[[building.ramps]]
direction = "north-up"
col = 3
row0 = 4
lower_level = 1           # lobby -> rooms-low

[[building.ramps]]
direction = "south-up"
col = 2
row0 = 4
lower_level = 2           # rooms-low -> rooms-high

[[building.ramps]]
direction = "north-up"
col = 3
row0 = 4
lower_level = 3           # rooms-high -> rooftop

# East staircase (cols 16-17) — mirror of the west staircase: south-up on the
# outer column (17), north-up on the inner column (16). This makes both stair
# landings face the building interior.
[[building.ramps]]
direction = "south-up"
col = 17
row0 = 4
lower_level = 0

[[building.ramps]]
direction = "north-up"
col = 16
row0 = 4
lower_level = 1

[[building.ramps]]
direction = "south-up"
col = 17
row0 = 4
lower_level = 2

[[building.ramps]]
direction = "north-up"
col = 16
row0 = 4
lower_level = 3
